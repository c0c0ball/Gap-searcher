# C사 진단 범위 사실 (Scope facts). 사람이 확인해 입력하는 값이며, 근거(basis)를 함께 적는다.
# 여기 없는 사실은 Scope Engine이 UNKNOWN 으로 본다.
organization: C사 (가상 B2B SaaS — HR·급여 클라우드 '피플클라우드', 임직원 약 300명)
as_of: '2026-11-02'
facts:
  scope.has_information_systems:
    value: true
    basis: 정보보호 정책 제2조
  scope.has_aws_accounts:
    value: true
    basis: AWS 계정 3개 (운영·개발·보안), 샌드박스 1개는 범위 제외
  scope.aws_iam_users_with_console_password:
    value: true
    basis: 계정관리대장 — 콘솔 사용 계정 존재
  scope.service_has_customer_login:
    value: true
    basis: 고객사 관리자·직원이 피플클라우드에 로그인
  scope.uses_cognito:
    value: true
    basis: 피플클라우드 로그인에 Amazon Cognito 사용 (c-prod)
