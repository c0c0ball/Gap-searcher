# 개발용 정답지 (공개). 규칙 개발·디버깅에 쓰며, 최종 평가에는 쓰지 않는다.
# 최종 평가용 숨김 정답지는 별도 세션이 다른 가상 시나리오로 만들고 해시만 저장소에 남긴다.
scenario: a-corp-dev
as_of: "2026-11-02"
seeded_defects:
  - id: D1
    ar: AR-2.5.4-02
    what: a-prod IAM 최소 길이 8 (지침 제5조①1 은 10자)
    trap: 부칙 2(종전 비밀번호 유효)는 '이미 설정된 비밀번호'에 대한 경과규정이지 시스템 설정 기준을 낮추는 근거가 아니다.
  - id: D2
    ar: AR-2.5.4-02
    what: a-stg 계정에 IAM 비밀번호 정책 자체가 없음 (NoSuchEntity)
  - id: D3
    ar: AR-2.5.4-03
    what: ops-kim 이 발급받은 임시 비밀번호를 바꾸지 않고 로그인 (지침 제6조②)
  - id: D4
    ar: AR-2.5.4-04
    what: dev-lee 비밀번호 185일 미변경 (지침 제6조① 90일)
  - id: D5
    ar: AR-2.5.4-05
    what: Cognito 회원 비밀번호 최소 길이 6 (지침 제7조① 8자). 화면 안내 문구는 8자라서 화면만 보면 놓친다.
  # ── 2단계: IAM 수집기 (2.2.5, 2.5.1~2.5.6) ──
  - id: D6
    ar: AR-2.5.1-02
    what: ops-kim 에게 ReadOnlyAccess 가 그룹이 아니라 사용자에게 직접 붙어 있음 (지침 제9조②)
  - id: D7
    ar: AR-2.5.2-01
    what: a-stg 에 추측하기 쉬운 이름 'admin' 의 콘솔 계정 (지침 제4조③)
  - id: D8
    ar: AR-2.5.2-02
    what: a-stg 'admin' 은 사번 없이 콘솔을 쓰는 공용 계정인데 관리대장에 승인자 없음 (지침 제4조④)
  - id: D9
    ar: AR-2.5.5-01
    what: dev-choi 가 Admins 그룹(AdministratorAccess)에 있지만 특수권한자 목록에 없음 (지침 제11조①)
    trap: 직접 붙은 정책이 아니라 그룹으로 받은 관리자 권한이라, 사용자 정책만 보면 놓친다.
  - id: D10
    ar: AR-2.5.5-02
    what: 외부 유지보수 계정 vendor-maint 가 사용기한 없이 활성 (지침 제11조②)
  - id: D11
    ar: AR-2.5.3-01
    what: dev-park 가 콘솔 비밀번호를 쓰지만 MFA 미등록 (지침 제8조)
  - id: D12
    ar: AR-2.5.3-02
    what: a-stg 루트 사용자에 MFA 없음
  - id: D13
    ar: AR-2.2.5-01
    what: intern-jung(사번 A1031) 10월 15일 퇴직, 기준일까지 12영업일인데 계정 활성 (절차서 제4조 1영업일)
    trap: 인사 명부에는 IAM 이름이 없다. 계정 관리대장의 사번으로 이어야 찾을 수 있다.
  - id: D14
    ar: AR-2.5.6-02
    what: svc-legacy-etl 액세스 키가 206일 미사용인데 활성 (지침 제12조 90일)
  - id: D15
    ar: AR-2.5.6-01
    what: 마지막 접근권한 검토 2026-06-30, 3분기 검토 기록 없음 (지침 제10조 분기 1회 → 92일)
  # ── 2단계: 네트워크 (2.6) ──
  - id: D16
    ar: AR-2.6.1-01
    what: a-stg RDS stg-orders 공인 접근 허용 (지침 제13조②)
  - id: D17
    ar: AR-2.6.1-02
    what: a-stg 기본 보안그룹에 AWS 기본 규칙(같은 그룹 전체 허용, 나가는 전체 허용)이 남아 있음 (지침 제13조⑤)
  - id: D18
    ar: AR-2.6.2-01
    what: a-stg stg-legacy-ftp 보안그룹이 FTP(21) 허용 (지침 제14조②)
  - id: D19
    ar: AR-2.6.4-01
    what: a-prod DB 보안그룹이 앱 보안그룹 외에 VPC 전체 대역(10.10.0.0/16)에서 3306 허용 (지침 제13조③)
    trap: 앱 보안그룹에서 오는 정상 규칙이 같은 보안그룹에 함께 있어, 보안그룹 단위로만 보면 놓친다.
  - id: D20
    ar: AR-2.6.6-01
    what: a-prod 배스천 보안그룹 SSH 0.0.0.0/0 허용 (지침 제14조① 관리망 203.0.113.0/28)
  - id: D21
    ar: AR-2.6.7-01
    what: a-prod DB 서브넷 2개가 쓰는 라우팅 테이블에 NAT 기본 경로 (지침 제13조④)
    trap: 같은 NAT 경로가 앱 서브넷에도 있지만 앱 영역은 결함이 아니다.
  # ── 2단계: 암호화 (2.7) ──
  - id: D22
    ar: AR-2.7.1-01
    what: a-stg RDS stg-orders 저장 암호화 꺼짐 (암호통제 지침 제3조①). 정보자산 목록상 개인정보 포함
  - id: D23
    ar: AR-2.7.1-02
    what: a-prod 배치 서버 데이터 디스크 prod-batch-export(200GB) 암호화 안 됨 (제3조②)
  - id: D24
    ar: AR-2.7.1-03
    what: a-prod 회원 정보 내보내기 버킷이 SSE-S3(AES256)만 적용 — 지침은 회사 관리 키(KMS) (제3조③)
    trap: 버킷 자체는 암호화되어 있어 '암호화 여부'만 보면 놓친다. 개인정보 여부는 정보자산 목록으로 판단한다.
  - id: D25
    ar: AR-2.7.2-01
    what: a-prod 고객 관리형 키 alias/prod-data 자동 교체 꺼짐 (제6조)
  - id: D26
    ar: AR-2.7.2-03
    what: a-stg 고객 관리형 키 alias/stg-temp 가 암호키 관리대장에 없음 (제5조)
  - id: D27
    ar: AR-2.7.2-02
    what: a-stg 서버 디스크가 a-prod 계정의 키(prod-data)로 암호화됨 (제7조)
  - id: D28
    ar: AR-2.7.1-04
    what: a-prod 공개 ALB prod-web 의 HTTP:80 이 HTTPS 전환 없이 서비스 (제4조)
  - id: D29
    ar: AR-2.7.1-05
    what: a-stg 공개 ALB stg-web 의 443 보안 정책 ELBSecurityPolicy-2016-08 이 TLS 1.0 부터 허용 (제4조 TLS 1.2 이상)
non_defects:
  - a-shared 계정 정책은 지침보다 엄격(12자, 60일, 5회) — 결함 아님
  - svc-batch 는 콘솔 비밀번호가 없어 모집단에서 제외
  - <root_account> 행은 IAM 사용자 모집단이 아님 (루트는 AR-2.5.3-02에서 따로 봄)
  - svc-batch·svc-legacy-etl 은 콘솔 비밀번호가 없어 MFA 검사 대상이 아님
  - qa-seo 는 10월 30일(금) 퇴직, 기준일 11월 2일(월)까지 1영업일 — 회수 기한 안이라 아직 결함 아님
  - 한○○(A1009) 은 퇴직자지만 계정이 이미 회수되어 관리대장에도 없음 — 결함 아님
  - vendor-net 은 유지보수 계정이지만 사용기한 2026-12-31 이 기록됨 — 결함 아님
  - admin-park 는 두 계정 모두 관리자 권한이지만 특수권한자 목록에 있음 — 결함 아님
  - BatchJobRunner 사용자 정의 정책은 s3 일부 작업만 허용 — 관리자 권한 아님
  - a-prod ALB 443 을 0.0.0.0/0 에서 허용 — 웹 서비스 공개 포트라 결함 아님
  - a-prod 앱 보안그룹 SSH 는 배스천 보안그룹에서만 — 출발지가 보안그룹이라 원격 관리 규칙 대상 아님
  - a-stg 기본 보안그룹의 전체 포트 규칙은 FTP·Telnet 포트 허용(2.6.2)으로 세지 않음 — 기본 보안그룹 규칙(2.6.1-02)에서만
  - a-shared RDP 를 203.0.113.5/32 에서 허용 — 관리망(203.0.113.0/28) 안이라 결함 아님
  - a-shared 에는 RDS 가 없음 — DB 규칙은 대상 0건으로 통과
  - a-prod 배스천 디스크는 AWS 관리형 기본 키(aws/ebs)로 암호화 — 저장 암호화 충족, 키 교체 대상 아님
  - a-prod 정적 파일·a-shared 도구 로그 버킷은 SSE-S3 — 정보자산 목록상 개인정보 없음이라 결함 아님
  - a-prod 내부 전용 ALB 의 HTTP:8080 — 인터넷 구간이 아님
  - a-stg stg-web 의 HTTP:80 은 HTTPS 로 전환만 함 — 평문 서비스 아님
