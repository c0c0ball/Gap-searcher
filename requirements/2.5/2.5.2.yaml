# 2.5.2 사용자 식별 — IAM 단계 (2단계 자동화)
criterion: "2.5.2"
name: 사용자 식별
source:
  ref: SRC-KISA-GUIDE-2023-11
  locator: "안내서(2023.11) 89~90쪽(PDF 94~95) — 주요 확인사항 1~2, 결함사례 1~3"

checkpoints:
  - index: 1   # 유일한 식별자, 추측 가능한 식별자 제한
    covered_by: [AR-2.5.2-01]
  - index: 2   # 공용 식별자의 타당성 검토·승인
    covered_by: [AR-2.5.2-02]

requirements:
  - id: AR-2.5.2-01
    title: 콘솔 계정 이름이 추측하기 쉬운 이름이 아니다
    summary: >-
      지침이 추측하기 쉬운 계정 이름을 금지했다면, 콘솔 비밀번호가 있는 IAM 사용자 이름이
      admin·test·guest 같은 일반 단어가 아니어야 한다.
    plain:
      question: 사용자를 유일하게 구분할 수 있는 계정 이름을 쓰고, 추측하기 쉬운 이름의 사용을 제한하고 있는가?
      why: >-
        'admin' 같은 이름은 공격자가 가장 먼저 시도하는 이름이에요. 또 누가 쓰는 계정인지 알 수 없어서
        문제가 생겼을 때 책임을 따지기 어려워요.
      fix:
        - 이 계정을 쓰는 사람마다 이름이 드러나는 개인 계정을 만들어 주고, 일반 이름 계정은 삭제해요.
        - 꼭 남겨야 하면 이름을 바꾸고 공용 계정 승인 절차를 밟아요.
      owner: 클라우드(AWS) 관리자
    status: active
    source: {ref: SRC-KISA-GUIDE-2023-11, locator: "89쪽 주요 확인사항 1, 90쪽 결함사례 1"}
    checkpoints: [1]
    case_refs: ["KISA:2.5.2-1"]
    applicability:
      when: [scope.has_aws_accounts, scope.aws_iam_users_with_console_password]
    population:
      name: 콘솔 비밀번호가 있는 IAM 사용자
      source: T2.key
    tests:
      - id: T1
        type: DOCUMENT_EXTRACT
        description: 추측하기 쉬운 계정 이름 금지 조항
        params: [account.no_guessable_id]
      - id: T2
        type: CONFIG_COLLECT
        description: 사용자 이름 (credential report)
        collect:
          apis: ["iam:GetCredentialReport"]
          per: user
          fields: [key, user, password_enabled, generic_identifier]
      - id: T3
        type: SUBJECT_CHECK
        description: 콘솔 사용자 이름이 일반 단어(admin 등)가 아니어야 함
        check:
          population: T2
          where: {password_enabled: true}
          gate: T1.account.no_guessable_id
          field: generic_identifier
          op: falsy
          message: "{key}: 추측하기 쉬운 계정 이름 '{user}' (콘솔 비밀번호 사용)"
          plain: "{account}에 '{user}'처럼 누구나 짐작할 수 있는 이름의 계정이 있어요. 누가 쓰는 계정인지도 알 수 없어요."
    conforming_paths: [[T1, T2, T3]]
    violation_when:
      - test: T3
        condition: 추측하기 쉬운 이름의 콘솔 사용자가 1명 이상

  - id: AR-2.5.2-02
    title: 공용 계정은 승인받고 관리대장에 기록된다
    summary: >-
      지침이 공용 계정에 승인을 요구했다면, 계정 관리대장에서 개인 사번 없이 콘솔을 쓰는 계정(공용)은
      승인자가 기록되어 있어야 하고, 그 계정이 실제로 존재해야 비교한다.
    plain:
      question: 불가피하게 공용 계정을 쓰는 경우 그 사유를 검토하여 책임자의 승인을 받고 있는가?
      why: >-
        여러 사람이 한 계정을 쓰면 누가 무엇을 했는지 기록만으로는 알 수 없어요.
        꼭 필요한 경우에만 책임자가 승인하고, 누가 쓰는지 따로 관리해야 해요.
      fix:
        - 공용 계정이 정말 필요한지 다시 검토하고, 가능하면 개인 계정으로 나눠요.
        - 남긴다면 정보보호팀장 승인을 받아 관리대장에 승인자와 사용하는 사람을 적어요.
      owner: 정보보호팀 · 해당 부서장
    status: active
    source: {ref: SRC-KISA-GUIDE-2023-11, locator: "89쪽 주요 확인사항 2, 90쪽 결함사례 2·3"}
    checkpoints: [2]
    case_refs: ["KISA:2.5.2-2", "KISA:2.5.2-3"]
    applicability:
      when: [scope.has_aws_accounts]
    population:
      name: 계정 관리대장의 공용 계정 (사번 없이 콘솔 사용)
      source: T2.key
    tests:
      - id: T1
        type: DOCUMENT_EXTRACT
        description: 공용 계정 승인 조항
        params: [account.shared_requires_approval]
      - id: T2
        type: EVIDENCE_REVIEW
        description: 계정 관리대장의 사번·승인자
        evidence_kind: account_list
        params: [key, emp_no, shared, approver, purpose]
      - id: T3
        type: CONFIG_COLLECT
        description: 관리대장의 계정이 실제로 콘솔을 쓰는지
        collect:
          apis: ["iam:GetCredentialReport"]
          per: user
          fields: [key, user, password_enabled]
      - id: T4
        type: SUBJECT_CHECK
        description: 실제 콘솔을 쓰는 공용 계정에 승인자가 기록되어 있어야 함
        check:
          population: T2
          where: {shared: true}
          gate: T1.account.shared_requires_approval
          join: {test: T3, match: [key, key], missing: ok, where: {password_enabled: true}}
          field: approver
          op: truthy
          message: "{key}: 공용 계정('{purpose}')인데 관리대장에 승인자 없음"
          plain: "{account}의 '{user}' 계정은 여러 사람이 함께 쓰는 계정인데, 누가 승인했는지 기록이 없어요."
    conforming_paths: [[T1, T2, T3, T4]]
    violation_when:
      - test: T4
        condition: 승인자 없이 쓰이는 공용 계정이 1개 이상
