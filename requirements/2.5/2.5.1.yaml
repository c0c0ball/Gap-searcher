# 2.5.1 사용자 계정 관리 — IAM 단계 (2단계 자동화)
criterion: "2.5.1"
name: 사용자 계정 관리
source:
  ref: SRC-KISA-GUIDE-2023-11
  locator: "안내서(2023.11) 87~88쪽(PDF 92~93) — 주요 확인사항 1~3, 결함사례 1~3"

checkpoints:
  - index: 1   # 계정·권한 등록·변경·삭제 공식 절차
    covered_by: [AR-2.5.1-01]
  - index: 2   # 직무별 권한 분류에 따른 최소 권한
    covered_by: [AR-2.5.1-02]
  - index: 3   # 계정 보안책임 인식
    covered_by: []
    note: 보안서약서·계정 발급 안내문은 사람이 확인

requirements:
  - id: AR-2.5.1-01
    title: 계정 신청·승인 절차가 정해져 있다
    summary: >-
      정책·지침·절차서 중 하나 이상에 계정 발급 전 승인(신청서·결재)을 받는 절차가 정해져 있어야 한다.
    plain:
      question: 정보시스템 사용자 계정의 등록·변경·삭제를 위한 신청·승인 절차를 수립하고 있는가?
      why: >-
        누가 언제 어떤 계정을 받았는지 승인 기록이 있어야, 필요 없는 계정이나 권한이 생기는 것을 막을 수 있어요.
      fix:
        - 계정관리 절차서에 계정을 신청하는 방법, 승인하는 사람, 발급·변경·삭제 순서를 적어요.
        - 구두나 메신저 요청으로 계정을 만들지 않도록 신청서 양식을 정해요.
      owner: 정보보호팀
    status: active
    source: {ref: SRC-KISA-GUIDE-2023-11, locator: "87쪽 주요 확인사항 1, 88쪽 결함사례 1"}
    checkpoints: [1]
    case_refs: ["KISA:2.5.1-1"]
    applicability:
      when: [scope.has_information_systems]
    tests:
      - id: T1
        type: DOCUMENT_EXTRACT
        description: 계정 신청·승인 조항
        params: [account.request_approval]
    conforming_paths: [[T1]]
    single_axis_justification: >-
      '수립' 여부는 규정 문서 자체가 1차 증거다. 실제 승인 이력은 2.5.5(특수권한)와 사람 검토로 따로 확인한다.
    violation_when:
      - test: T1
        condition: 제출 문서 범위가 충족된 상태에서 계정 신청·승인 조항이 없음

  - id: AR-2.5.1-02
    title: 권한은 직무별 그룹으로만 부여된다
    summary: >-
      지침이 권한을 직무별 그룹으로만 부여하도록 정했다면, 범위 내 모든 AWS 계정에서
      IAM 사용자에게 정책이 직접(관리형·인라인) 붙어 있지 않아야 한다.
    plain:
      question: 사용자 접근권한을 직무별 권한 분류(그룹)에 따라 필요한 만큼만 부여하고 있는가?
      why: >-
        사람마다 권한을 따로 붙이면 누가 무슨 권한을 가졌는지 파악하기 어렵고, 업무가 바뀌어도 권한이 남기 쉬워요.
        직무별 그룹으로 주면 그룹만 보면 돼요.
      fix:
        - 사용자에게 직접 붙은 정책을 떼고, 같은 권한이 필요하면 직무 그룹에 넣어요.
        - 그 사람만 예외로 필요한 권한이면 이유와 기간을 적어 승인받아요.
      owner: 클라우드(AWS) 관리자
    status: active
    source: {ref: SRC-KISA-GUIDE-2023-11, locator: "87쪽 주요 확인사항 2, 88쪽 결함사례 3"}
    checkpoints: [2]
    case_refs: ["KISA:2.5.1-3"]
    applicability:
      when: [scope.has_aws_accounts]
    population:
      name: 범위 내 AWS 계정의 IAM 사용자
      source: T2.key
    tests:
      - id: T1
        type: DOCUMENT_EXTRACT
        description: 그룹 단위 권한 부여 조항
        params: [access.group_based]
      - id: T2
        type: CONFIG_COLLECT
        description: 사용자별 그룹·직접 정책 (권한 상세)
        collect:
          apis: ["iam:GetCredentialReport", "iam:GetAccountAuthorizationDetails"]
          per: user
          fields: [key, user, groups, direct_policies]
      - id: T3
        type: SUBJECT_CHECK
        description: 사용자에게 직접 붙은 정책이 없어야 함
        check:
          population: T2
          gate: T1.access.group_based
          field: direct_policies
          op: empty
          message: "{key}: 사용자에게 정책이 직접 부여됨 ({direct_policies}) — 그룹 {groups}"
          plain: "{account}의 {user}님에게 '{direct_policies}' 권한이 직무 그룹을 거치지 않고 직접 붙어 있어요."
    conforming_paths: [[T1, T2, T3]]
    violation_when:
      - test: T3
        condition: 정책이 직접 붙은 IAM 사용자가 1명 이상
