# 2.5.4 비밀번호 관리 — 파일럿 첫 항목
# 원칙: 기준값은 조직 자체 정책 문서에서 뽑는다 (D08). KISA 원문은 이 파일에 복제하지 않는다.
criterion: "2.5.4"
name: 비밀번호 관리
source:
  ref: SRC-KISA-GUIDE-2023-11
  locator: "안내서(2023.11) 94~95쪽(PDF 99~100) — 주요 확인사항 1~3, 결함사례 1~3"
  via: SRC-PROWLER-KISA-ISMSP

checkpoints:
  - index: 1   # 정보시스템 사용자 비밀번호 관리절차·작성규칙 수립·이행
    covered_by: [AR-2.5.4-01, AR-2.5.4-02, AR-2.5.4-03, AR-2.5.4-04]
  - index: 2   # 정보주체(이용자) 비밀번호 작성규칙 수립·이행
    covered_by: [AR-2.5.4-05]
  - index: 3   # 인증수단의 안전한 적용·관리
    covered_by: []
    note: 2.5.3 사용자 인증(MFA 등)과 함께 다음 단계에서 작성

requirements:
  - id: AR-2.5.4-01
    title: 비밀번호 작성규칙이 정책 문서에 정해져 있다
    summary: >-
      조직의 정책·지침·절차서 중 하나 이상에 정보시스템 사용자 비밀번호의
      작성규칙(최소 길이, 문자 조합, 변경 주기, 재사용 제한, 임시 비밀번호 처리)이 정해져 있어야 한다.
    plain:
      question: 정보시스템 사용자의 비밀번호 작성규칙을 정책·지침으로 수립하고 있는가?
      why: >-
        규칙이 글로 정해져 있어야 모든 시스템이 같은 기준으로 설정되고, 직원들도 무엇을 지켜야 하는지 알 수 있어요.
      fix:
        - 접근통제 지침 같은 규정에 비밀번호 최소 길이, 섞어 쓸 문자 종류, 바꾸는 주기, 재사용 제한, 임시 비밀번호 처리 방법을 적어요.
        - 규정을 바꾸면 개정 이력을 남기고 직원들에게 공지해요.
      owner: 정보보호팀
    status: active
    source: {ref: SRC-KISA-GUIDE-2023-11, locator: "94쪽 주요 확인사항 1", via: SRC-PROWLER-KISA-ISMSP}
    checkpoints: [1]
    case_refs: ["KISA:2.5.4-1"]
    applicability:
      when: [scope.has_information_systems]
    tests:
      - id: T1
        type: DOCUMENT_EXTRACT
        description: 정책 문서에서 비밀번호 규칙 조항을 찾아 값과 인용 위치를 뽑는다
        params:
          - password.min_length
          - password.complexity_classes
          - password.max_age_days
          - password.reuse_prevention
          - password.temp_force_change
    conforming_paths: [[T1]]
    single_axis_justification: >-
      '수립' 여부는 정책 문서 자체가 1차 증거다. 실제 이행은 AR-2.5.4-02~04가 기술 관측으로 따로 확인한다.
    violation_when:
      - test: T1
        condition: 제출 문서 범위(Coverage)가 충족된 상태에서 비밀번호 규칙 조항이 하나도 없음

  - id: AR-2.5.4-02
    title: 정책의 작성규칙과 AWS IAM 실제 설정이 일치한다
    summary: >-
      정책 문서가 정한 최소 길이·문자 조합·변경 주기·재사용 제한이 범위 내 모든 AWS 계정의
      IAM 계정 비밀번호 정책에 같거나 더 엄격하게 설정되어 있어야 한다.
    plain:
      question: 수립한 비밀번호 작성규칙을 정보시스템(AWS 계정) 설정에 동일하게 적용하여 이행하고 있는가?
      why: >-
        규정에 '10자 이상'이라고 적어도 시스템 설정이 더 짧게 되어 있으면 실제로는 짧은 비밀번호가 만들어져요.
        규칙은 시스템에 설정되어야 지켜져요.
      fix:
        - AWS 콘솔 → IAM → 계정 설정 → 비밀번호 정책 → 편집에서 회사 규칙과 같은 값으로 바꿔요.
        - AWS 계정이 여러 개라면 모든 계정에서 같은 작업을 해요. 정책이 아예 없는 계정이 없는지도 확인해요.
        - 바꾼 뒤 설정 화면을 캡처해 정보보호팀에 전달해요.
      owner: 클라우드(AWS) 관리자
    status: active
    source: {ref: SRC-KISA-GUIDE-2023-11, locator: "95쪽 결함사례 1", via: SRC-PROWLER-KISA-ISMSP}
    checkpoints: [1]
    case_refs: ["KISA:2.5.4-1"]
    applicability:
      when: [scope.has_aws_accounts, scope.aws_iam_users_with_console_password]
    population:
      name: 범위 내 AWS 계정
      source: scope.aws_accounts
    tests:
      - id: T1
        type: DOCUMENT_EXTRACT
        description: 정책 문서의 비밀번호 규칙 값
        params:
          - password.min_length
          - password.require_uppercase
          - password.require_lowercase
          - password.require_number
          - password.require_symbol
          - password.max_age_days
          - password.reuse_prevention
      - id: T2
        type: CONFIG_COLLECT
        description: 계정별 IAM 비밀번호 정책 (정책이 아예 없으면 NoSuchEntity로 기록)
        collect:
          apis: ["iam:GetAccountPasswordPolicy"]
          per: account
          fields:
            - MinimumPasswordLength
            - RequireUppercaseCharacters
            - RequireLowercaseCharacters
            - RequireNumbers
            - RequireSymbols
            - MaxPasswordAge
            - PasswordReusePrevention
          derive:
            policy_exists: "NoSuchEntity가 아니면 true"
      - id: T3
        type: PARAMETER_COMPARE
        description: 정책 값과 실제 설정 비교 (정책에 없는 항목은 건너뜀)
        compare:
          - {expected: T1.password.min_length, observed: T2.MinimumPasswordLength, op: ">="}
          - {expected: T1.password.require_uppercase, observed: T2.RequireUppercaseCharacters, op: "=="}
          - {expected: T1.password.require_lowercase, observed: T2.RequireLowercaseCharacters, op: "=="}
          - {expected: T1.password.require_number, observed: T2.RequireNumbers, op: "=="}
          - {expected: T1.password.require_symbol, observed: T2.RequireSymbols, op: "=="}
          - {expected: T1.password.max_age_days, observed: T2.MaxPasswordAge, op: "<=", note: "0 또는 미설정은 '만료 없음'으로 해석"}
          - {expected: T1.password.reuse_prevention, observed: T2.PasswordReusePrevention, op: ">="}
    conforming_paths: [[T1, T2, T3]]
    violation_when:
      - test: T3
        condition: 품질 통과한 관측에서 한 계정이라도 비교 하나가 실패 (정책 미설정 계정 포함)

  - id: AR-2.5.4-03
    title: 임시 비밀번호는 첫 로그인 때 바뀐다
    summary: >-
      정책이 임시 비밀번호의 강제 변경을 정했다면, 관리자가 발급한 콘솔 비밀번호는
      다음 로그인 시 변경이 요구되도록 설정되고 실제로 변경되어 있어야 한다.
    plain:
      question: 관리자가 발급·초기화한 임시 비밀번호를 최초 로그인 시 변경하도록 이행하고 있는가?
      why: >-
        임시 비밀번호는 관리자도 알고, 메신저나 메일로 전달되기도 해요. 바꾸지 않고 쓰면 다른 사람이 그 비밀번호로 들어올 수 있어요.
      fix:
        - 해당 직원은 지금 바로 비밀번호를 바꿔요.
        - 관리자는 콘솔 사용자를 만들 때 '다음 로그인 시 비밀번호 재설정 필요'를 반드시 체크해요.
      owner: 해당 직원 · 클라우드(AWS) 관리자
    status: active
    source: {ref: SRC-KISA-GUIDE-2023-11, locator: "95쪽 결함사례 2", via: SRC-PROWLER-KISA-ISMSP}
    checkpoints: [1]
    case_refs: ["KISA:2.5.4-2"]
    applicability:
      when: [scope.has_aws_accounts, scope.aws_iam_users_with_console_password]
    population:
      name: 콘솔 비밀번호가 있는 IAM 사용자
      source: T2.user
    tests:
      - id: T1
        type: DOCUMENT_EXTRACT
        description: 임시 비밀번호 강제 변경 규정 여부
        params: [password.temp_force_change]
      - id: T2
        type: CONFIG_COLLECT
        description: 사용자별 로그인 프로필과 credential report
        collect:
          apis: ["iam:GenerateCredentialReport", "iam:GetCredentialReport", "iam:GetLoginProfile"]
          per: user
          fields: [user, password_enabled, password_last_changed, password_last_used, LoginProfileCreateDate, PasswordResetRequired]
          derive:
            used_issued_password: >-
              password_last_changed가 로그인 프로필 발급 시각(LoginProfileCreateDate)에서 1분 이내이고
              그 뒤 password_last_used가 있으며 PasswordResetRequired가 false.
              한계: 관리자가 UpdateLoginProfile로 재발급하면 발급 시각이 갱신되지 않아 놓칠 수 있음
      - id: T3
        type: PARAMETER_COMPARE
        description: 규정이 강제 변경을 요구하면, 발급 후 변경 없이 사용 중인 사용자가 없어야 함
        compare:
          - {expected: T1.password.temp_force_change, observed: T2.used_issued_password, op: "forbids",
             note: "규정이 true이면 관측값은 false여야 함"}
    conforming_paths: [[T1, T2, T3]]
    violation_when:
      - test: T3
        condition: 규정이 강제 변경을 요구하는데 발급 비밀번호를 바꾸지 않고 로그인한 사용자가 1명 이상

  - id: AR-2.5.4-04
    title: 비밀번호 변경 주기가 실제로 지켜진다
    summary: >-
      정책이 변경 주기를 정했다면, 콘솔 비밀번호를 쓰는 모든 IAM 사용자의 마지막 변경 시점이
      기준일로부터 그 주기 안에 있어야 한다.
    plain:
      question: 정책에 정한 비밀번호 변경주기를 사용자별로 이행하고 있는가?
      why: >-
        같은 비밀번호를 오래 쓰면 어딘가에서 새어 나갔을 때 그만큼 오래 악용될 수 있어요.
      fix:
        - 해당 직원은 지금 비밀번호를 바꿔요.
        - 관리자는 AWS 비밀번호 정책의 '비밀번호 만료'를 회사 규칙의 기간으로 켜 두면, 기간이 지나면 시스템이 변경을 요구해요.
      owner: 해당 직원 · 클라우드(AWS) 관리자
    status: active
    source: {ref: SRC-KISA-GUIDE-2023-11, locator: "95쪽 결함사례 3", via: SRC-PROWLER-KISA-ISMSP}
    checkpoints: [1]
    case_refs: ["KISA:2.5.4-3"]
    applicability:
      when: [scope.has_aws_accounts, scope.aws_iam_users_with_console_password]
    population:
      name: 콘솔 비밀번호가 활성인 IAM 사용자
      source: T2.user
    tests:
      - id: T1
        type: DOCUMENT_EXTRACT
        description: 정책의 비밀번호 변경 주기(일)
        params: [password.max_age_days]
      - id: T2
        type: CONFIG_COLLECT
        description: credential report의 사용자별 마지막 변경 시각
        collect:
          apis: ["iam:GenerateCredentialReport", "iam:GetCredentialReport"]
          per: user
          fields: [user, password_enabled, password_last_changed]
      - id: T3
        type: CADENCE_CHECK
        description: 기준일 - password_last_changed <= 정책 주기
        cadence:
          last_event: T2.password_last_changed
          max_interval_days: T1.password.max_age_days
    conforming_paths: [[T1, T2, T3]]
    violation_when:
      - test: T3
        condition: 주기를 넘긴 사용자가 1명 이상 (예외 승인 기록이 없는 경우)

  - id: AR-2.5.4-05
    title: 이용자(정보주체) 비밀번호 규칙이 서비스에 적용되어 있다
    summary: >-
      고객·회원 로그인이 있는 서비스라면, 정책이 정한 이용자 비밀번호 규칙이 가입·변경 화면이나
      인증 서비스 설정에 실제로 적용되어 있어야 한다.
    plain:
      question: 정보주체(이용자) 비밀번호 작성규칙을 수립하고 서비스에 적용하여 이행하고 있는가?
      why: >-
        가입 화면에 규칙을 안내해도 실제 설정이 더 느슨하면 짧은 비밀번호로도 가입돼요.
        회원 계정이 쉽게 뚫리면 개인정보가 새어 나갈 수 있어요.
      fix:
        - 회원 인증 설정(Cognito 사용자 풀 → 로그인 환경 → 비밀번호 정책)의 최소 길이를 회사 규칙에 맞춰요.
        - 바꾼 규칙은 새로 정하는 비밀번호부터 적용돼요. 기존 회원에게는 다음 로그인 때 변경을 안내할지 정해요.
        - 가입 화면에서 짧은 비밀번호를 넣으면 실제로 거부되는지 직접 시험하고 화면을 캡처해 둬요.
      owner: 개발팀(회원 서비스)
    status: active
    source: {ref: SRC-KISA-GUIDE-2023-11, locator: "94쪽 주요 확인사항 2", via: SRC-PROWLER-KISA-ISMSP}
    checkpoints: [2]
    applicability:
      when: [scope.service_has_customer_login]
    tests:
      - id: T1
        type: DOCUMENT_EXTRACT
        description: 이용자 비밀번호 규칙
        params: [customer_password.min_length, customer_password.complexity_classes]
      - id: T2
        type: EVIDENCE_REVIEW
        description: 회원가입·비밀번호 변경 화면 캡처에서 규칙 안내와 거부 동작 확인
        params: [screen.rule_shown, screen.weak_password_rejected, screen.captured_at]
      - id: T3
        type: CONFIG_COLLECT
        description: Cognito를 쓰는 경우 사용자 풀 비밀번호 정책
        when: scope.uses_cognito
        collect:
          apis: ["cognito-idp:DescribeUserPool"]
          per: resource
          fields: [MinimumLength, RequireUppercase, RequireLowercase, RequireNumbers, RequireSymbols]
      - id: T4
        type: PARAMETER_COMPARE
        description: Cognito 최소 길이가 정책 이상인지
        when: scope.uses_cognito
        compare:
          - {expected: T1.customer_password.min_length, observed: T3.MinimumLength, op: ">="}
    conforming_paths: [[T1, T2], [T1, T3, T4]]
    violation_when:
      - test: T4
        condition: Cognito 최소 길이가 정책보다 짧음
      - test: T2
        condition: 화면에서 정책보다 약한 비밀번호가 허용됨이 확인됨
