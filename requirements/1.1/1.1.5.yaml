# 1.1.5 정책 수립 — 관리체계 단계
criterion: "1.1.5"
name: 정책 수립
source:
  ref: SRC-KISA-GUIDE-2023-11
  locator: "안내서(2023.11) 19~21쪽(PDF 24~26) — 주요 확인사항 1~4, 결함사례 1~3"

checkpoints:
  - index: 1   # 최상위 정책 수립
    covered_by: [AR-1.1.5-02]
  - index: 2   # 세부 지침·절차 수립
    covered_by: []
    note: 지침·절차가 정책의 활동을 빠짐없이 다루는지는 사람이 확인
  - index: 3   # 제·개정 시 최고경영자 또는 위임받은 자의 승인
    covered_by: [AR-1.1.5-01]
  - index: 4   # 최신본을 임직원에게 제공
    covered_by: []
    note: 게시판·문서함 공유 여부는 사람이 확인

requirements:
  - id: AR-1.1.5-01
    title: 정책·지침이 정해진 승인권자의 승인을 받았다
    summary: >-
      정책이 정책·지침의 승인권자를 정했다면, 진단에 제출된 모든 정책·지침 문서의 표지(문서 정보 표) 승인자가 그 승인권자 중 하나여야 한다.
      승인자 칸이 비어 있으면 승인 근거가 없는 것으로 본다.
    plain:
      question: 정보보호 정책·시행문서를 제·개정할 때 최고경영자 또는 권한을 위임받은 자의 승인을 받고 있는가?
      why: >-
        정해진 사람의 승인 없이 시행된 규정은 회사의 공식 기준으로 인정받기 어렵고, 직원들도 따를 근거가 약해져요.
      fix:
        - 해당 문서를 정책에 정한 승인권자(정보보호최고책임자 또는 대표이사)에게 다시 승인받고 표지를 고쳐요.
        - 승인 기록(결재 문서)을 함께 보관해요.
      owner: 정보보호팀
    status: active
    source: {ref: SRC-KISA-GUIDE-2023-11, locator: "19쪽 주요 확인사항 3, 21쪽 결함사례 1"}
    checkpoints: [3]
    case_refs: ["KISA:1.1.5-1"]
    applicability:
      when: [scope.has_information_systems]
    population:
      name: 제출된 정책·지침 문서
      source: T2.key
    tests:
      - id: T1
        type: DOCUMENT_EXTRACT
        description: 정책·지침 승인권자
        params: [policy.approvers]
      - id: T2
        type: EVIDENCE_REVIEW
        description: 문서별 표지 정보 (문서번호·제목·승인자)
        evidence_kind: policy_doc_meta
        params: [key, doc_id, title, approver]
      - id: T3
        type: SUBJECT_CHECK
        description: 승인자가 승인권자 중 하나여야 함
        check:
          population: T2
          field: approver
          op: in
          value: T1.policy.approvers
          message: "{doc_id}({title}): 승인자 '{approver}' — 정책의 승인권자 {limit} 아님"
          plain: "'{title}'은(는) '{approver}' 승인으로 시행되고 있어요. 회사 정책은 {limit} 중 한 사람의 승인을 받도록 하고 있어요."
    conforming_paths: [[T1, T2, T3]]
    violation_when:
      - test: T3
        condition: 승인권자가 아닌 사람이 승인한 문서가 1개 이상

  - id: AR-1.1.5-02
    title: 정책·지침을 정한 주기 안에 검토·개정했다
    summary: >-
      정책이 정책·지침의 검토 주기를 정했다면, 제출된 모든 정책·지침 문서의 개정 이력 표 마지막 날짜가 기준일로부터 그 주기 안이어야 한다.
      개정 없이 검토만 한 경우도 개정 이력(검토 기록)에 남기는 것을 전제로 한다.
    plain:
      question: 정보보호 정책과 지침을 정한 주기에 따라 검토하여 최신 상태로 유지하고 있는가?
      why: >-
        법령과 시스템은 계속 바뀌어요. 오래 손대지 않은 규정은 지금의 업무·법과 맞지 않는 내용을 그대로 담고 있기 쉬워요.
      fix:
        - 해당 문서를 검토해 바뀐 법령·조직·하위 지침을 반영하고, 개정 이력에 검토 날짜와 내용을 적어요.
        - 바꿀 내용이 없어도 '검토 — 변경 없음'으로 이력을 남겨요.
      owner: 정보보호팀
    status: active
    source: {ref: SRC-KISA-GUIDE-2023-11, locator: "19쪽 주요 확인사항 1, 21쪽 결함사례 2"}
    checkpoints: [1]
    case_refs: ["KISA:1.1.5-2"]
    applicability:
      when: [scope.has_information_systems]
    population:
      name: 제출된 정책·지침 문서
      source: T2.key
    tests:
      - id: T1
        type: DOCUMENT_EXTRACT
        description: 정책·지침 검토 주기
        params: [policy.review_cycle_days]
      - id: T2
        type: EVIDENCE_REVIEW
        description: 문서별 개정 이력의 마지막 날짜
        evidence_kind: policy_doc_meta
        params: [key, doc_id, title, last_revised]
      - id: T3
        type: SUBJECT_CHECK
        description: 마지막 개정·검토가 주기 안이어야 함
        check:
          population: T2
          field: last_revised
          op: age_days_le
          value: T1.policy.review_cycle_days
          message: "{doc_id}({title}): 마지막 개정·검토 {last_revised} → {days}일 경과 (주기 {limit}일)"
          plain: "'{title}'은(는) {last_revised} 이후 {days}일 동안 검토·개정 기록이 없어요. 회사 정책은 {limit}일 안에 다시 검토하는 거예요."
    conforming_paths: [[T1, T2, T3]]
    violation_when:
      - test: T3
        condition: 주기를 넘긴 문서가 1개 이상
