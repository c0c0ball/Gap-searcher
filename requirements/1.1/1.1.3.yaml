# 1.1.3 조직 구성 — 관리체계 단계
criterion: "1.1.3"
name: 조직 구성
source:
  ref: SRC-KISA-GUIDE-2023-11
  locator: "안내서(2023.11) 15~16쪽(PDF 20~21) — 주요 확인사항 1~3, 결함사례 1~4"

checkpoints:
  - index: 1   # 실무조직 구성·운영
    covered_by: []
    note: 조직도·인원·전문성은 사람이 확인
  - index: 2   # 위원회 구성·운영
    covered_by: [AR-1.1.3-01]
  - index: 3   # 실무 협의체 구성·운영
    covered_by: []
    note: 협의체 운영 실적은 사람이 확인

requirements:
  - id: AR-1.1.3-01
    title: 정보보호위원회를 정한 주기마다 연다
    summary: >-
      정책이 정보보호위원회 개최 주기를 정했다면, 위원회 회의록 목록의 가장 최근 개최일이 기준일로부터 그 주기 안에 있어야 한다. 연은 366일로 센다.
      위원 구성(경영진·개인정보보호 조직 포함)과 안건의 충실성은 사람이 확인한다.
    plain:
      question: 중요한 정보보호 사항을 검토·의결하는 위원회를 구성하여 정한 주기에 따라 운영하고 있는가?
      why: >-
        위원회가 열리지 않으면 정보보호 계획·예산 같은 중요한 결정이 경영진 승인 없이 흘러가거나 미뤄져요.
      fix:
        - 올해 정보보호위원회를 열어 정보보호 계획, 예산, 위험평가 결과를 심의하고 회의록을 남겨요.
        - 다음 개최 시기를 연간 일정에 넣어 둬요.
      owner: 정보보호팀 · 경영진
    status: active
    source: {ref: SRC-KISA-GUIDE-2023-11, locator: "15쪽 주요 확인사항 2, 16쪽 결함사례 3"}
    checkpoints: [2]
    case_refs: ["KISA:1.1.3-3"]
    applicability:
      when: [scope.has_information_systems]
    population:
      name: 정보보호위원회 회의록
      source: T2.held_on
    tests:
      - id: T1
        type: DOCUMENT_EXTRACT
        description: 위원회 개최 주기
        params: [committee.cycle_days]
      - id: T2
        type: EVIDENCE_REVIEW
        description: 정보보호위원회 회의록 목록 (개최일·안건·참석자)
        evidence_kind: committee_log
        params: [held_on]
      - id: T3
        type: CADENCE_CHECK
        description: 가장 최근 개최일이 주기 안인지
        cadence:
          last_event: T2.held_on
          max_interval_days: T1.committee.cycle_days
          aggregate: latest
          plain: "마지막 정보보호위원회가 {last}에 열렸어요. 회사 정책대로라면 {max_days}일 안에 다시 열었어야 하는데 {days}일이 지났어요."
    conforming_paths: [[T1, T2, T3]]
    violation_when:
      - test: T3
        condition: 가장 최근 위원회가 정한 주기를 넘김
