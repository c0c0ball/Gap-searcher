# 2.6.7 인터넷 접속 통제 — 네트워크 단계 (2단계 자동화)
# 법령 변경: 인터넷망 차단 조치는 고시 제2026-9호 제6조의2로 옮겨졌다 (안내서 2023.11은 제6조로 표기).
criterion: "2.6.7"
name: 인터넷 접속 통제
source:
  ref: SRC-KISA-GUIDE-2023-11
  locator: "안내서(2023.11) 115~116쪽(PDF 120~121) — 주요 확인사항 1~3, 결함사례 1~5"

checkpoints:
  - index: 1   # 업무용 PC 인터넷 접속 통제
    covered_by: []
    note: 단말 웹 필터링·P2P 차단 설정은 사람이 확인
  - index: 2   # 주요 정보시스템(DB 등)의 불필요한 인터넷 접속 통제
    covered_by: [AR-2.6.7-01]
  - index: 3   # 법령상 인터넷망 차단 의무 대상자 식별·조치
    covered_by: []
    note: 의무 대상 여부와 대상자는 고시 제2026-9호 제6조의2(예외는 제2항·별표) 기준으로 사람이 판단

requirements:
  - id: AR-2.6.7-01
    title: 데이터베이스 서브넷에서 인터넷으로 나가는 경로가 없다
    summary: >-
      지침이 DB 영역 서버의 인터넷 직접 접속을 금지했다면, RDS가 쓰는 서브넷에 연결된 라우팅 테이블에
      인터넷 게이트웨이·NAT 게이트웨이로 가는 기본 경로(0.0.0.0/0, ::/0)가 없어야 한다.
    plain:
      question: 데이터베이스 등 주요 정보시스템에서 불필요한 외부 인터넷 접속을 차단하고 있는가?
      why: >-
        데이터베이스 영역에서 인터넷으로 나가는 길이 열려 있으면, 악성코드가 들어왔을 때 데이터를 밖으로 빼내기 쉬워요.
      fix:
        - DB 서브넷 전용 라우팅 테이블을 만들고 내부 경로(local)만 남겨요. 앱 서브넷과 같은 표를 쓰고 있다면 분리해요.
        - 패치·백업 때문에 외부 접근이 필요하면 VPC 엔드포인트처럼 인터넷을 거치지 않는 방법을 써요.
      owner: 클라우드(AWS) 관리자
    status: active
    source: {ref: SRC-KISA-GUIDE-2023-11, locator: "115쪽 주요 확인사항 2, 116쪽 결함사례 3"}
    checkpoints: [2]
    case_refs: ["KISA:2.6.7-3"]
    applicability:
      when: [scope.has_aws_accounts]
    population:
      name: RDS가 쓰는 서브넷
      source: T2.key
    tests:
      - id: T1
        type: DOCUMENT_EXTRACT
        description: DB 영역 인터넷 접속 금지 조항
        params: [network.db_no_internet]
      - id: T2
        type: CONFIG_COLLECT
        description: 서브넷·라우팅 테이블과 RDS 서브넷 그룹
        collect:
          apis: ["ec2:DescribeSubnets", "ec2:DescribeRouteTables", "rds:DescribeDBInstances"]
          per: resource
          kind: aws_subnet
          fields: [key, name, db_subnet, db_instances, route_table, internet_route, internet_target]
      - id: T3
        type: SUBJECT_CHECK
        description: DB 서브넷 라우팅에 인터넷 기본 경로가 없어야 함
        check:
          population: T2
          where: {db_subnet: true}
          gate: T1.network.db_no_internet
          field: internet_route
          op: falsy
          message: "{key}({name}, DB {db_instances}): 라우팅 {route_table} 의 기본 경로가 {internet_target}"
          plain: "{account}의 데이터베이스 서브넷 '{name}'에서 인터넷으로 나가는 길({internet_target})이 열려 있어요."
    conforming_paths: [[T1, T2, T3]]
    violation_when:
      - test: T3
        condition: 인터넷 기본 경로가 있는 DB 서브넷이 1개 이상
